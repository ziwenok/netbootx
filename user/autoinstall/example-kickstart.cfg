# NetBootX 示例 Kickstart 模板（RHEL / CentOS / Rocky / AlmaLinux / openEuler / Kylin）
#
# 用法：
#   1. 复制本文件到 user/autoinstall/ 并改名为你自己的，比如 rocky9-ks.cfg
#   2. 改下面的分区、密码、时区、网卡名
#   3. 在 NetBootX 界面给对应 ISO 挂上这个模板
#   4. 客户机启动时会自动带上 inst.ks=http://<server>:16000/user/autoinstall/rocky9-ks.cfg
#
# 注意：%post 里如果需要联网，确保网络在安装阶段已配置好。

#version=RHEL9

### 语言与时区
lang zh_CN.UTF-8
keyboard --vckeymap=us --xlayouts='us'
timezone Asia/Shanghai --isUtc

### 安装源：由内核参数 inst.stage2 / inst.repo 指定，这里不写

### 网络：按 MAC 或网卡名匹配
# 如果想让客户机自动拿 DHCP，用 --bootproto=dhcp
network --bootproto=dhcp --device=link --activate --onboot=yes
network --hostname=node01

### 磁盘：清空第一块盘
# 危险：会擦掉目标机所有数据。测试前请确认。
zerombr
clearpart --all --initlabel --drives=sda

### 分区方案（UEFI + LVM）
# BIOS 机器请把 efi 分区换成 biosboot
part /boot/efi --fstype=efi --size=600 --asprimary
part /boot --fstype=xfs --size=1024
part pv.01 --size=1 --grow
volgroup vg_root pv.01
logvol /     --fstype=xfs --name=lv_root --vgname=vg_root --size=20480
logvol /var  --fstype=xfs --name=lv_var  --vgname=vg_root --size=10240
logvol /home --fstype=xfs --name=lv_home --vgname=vg_root --size=5120
logvol swap  --fstype=swap --name=lv_swap --vgname=vg_root --size=8192

### root 密码
# 用 python3 -c "import crypt; print(crypt.crypt('你的密码', crypt.mksalt(crypt.METHOD_SHA512)))" 生成
# 下面这个是 'netbootx' 的哈希，务必改掉
rootpw --iscrypted $6$rounds=4096$Xk8Qm2Lp$Y9vN3sT5wR7uE1iO4aZ6cB8dF0gH2jK4lM6nO8pQ0rS2tU4vW6xY8zA0bC2dE4fG6hI8jK0lM2n

### 用户
user --name=admin --groups=wheel --iscrypted --password=$6$rounds=4096$Xk8Qm2Lp$Y9vN3sT5wR7uE1iO4aZ6cB8dF0gH2jK4lM6nO8pQ0rS2tU4vW6xY8zA0bC2dE4fG6hI8jK0lM2n

### 安全
selinux --enforcing
firewall --enabled --service=ssh

### 软件包
%packages --ignoremissing
@^minimal-environment
@standard
vim-enhanced
wget
curl
net-tools
tuned
%end

### 安装后脚本
%post --log=/root/ks-post.log
# 关掉不必要的服务
systemctl disable --now firewalld 2>/dev/null || true
# 装常用工具
dnf install -y epel-release 2>/dev/null || true
# 写个标记文件，方便确认是自动安装的
echo "Installed by NetBootX on $(date)" > /etc/netbootx-installed
%end

### 重启
reboot --eject
